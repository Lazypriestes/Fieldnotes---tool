<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview tree</title>
<style>
  :root{
    --surface:#FFF; --ink:#15181B; --muted:#868D94; --faint:#AAB1B6;
    --line:#DBDEE0; --hair:#E9EBEC; --accent:#2B5FD9; --accent-soft:#EDF2FE;
    --red:#C4695A; --amber:#CF9A3A; --green:#4E9A6B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{background:var(--surface);color:var(--ink);font-size:13px;
    font-family:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Inter,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.85em;letter-spacing:.02em}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .app{height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}

  .bar{display:flex;align-items:center;gap:12px;height:42px;padding:0 14px;border-bottom:1px solid var(--hair);flex:none}
  .bar .name{color:var(--muted)} .bar .name b{color:var(--ink);font-weight:500}
  .bar .spacer{flex:1}
  .bar button{color:var(--muted);letter-spacing:.06em}
  .bar button:hover{color:var(--ink)}
  .bar button.primary{color:var(--accent)}
  .bar button.tgl{border:1px solid var(--line);border-radius:4px;padding:3px 10px}
  .bar button.tgl[aria-pressed="true"]{background:var(--ink);color:#FFF;border-color:var(--ink)}
  .bar button.tgl.cam[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
  .bar button.primary.on{color:var(--red)}
  .seg2{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .seg2 button{padding:3px 9px;color:var(--faint);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
  .seg2 button[aria-pressed="true"]{background:var(--ink);color:#FFF}
  .seg2 .cnt{font-size:9px;background:rgba(255,255,255,.22);border-radius:7px;padding:0 4px;min-width:14px;text-align:center}
  .seg2 button[aria-pressed="false"] .cnt{background:#EFF0F1;color:var(--faint)}

  .spine{display:flex;align-items:center;gap:12px;padding:9px 14px 10px;border-bottom:1px solid var(--hair);flex:none}
  .track{flex:1;display:flex;gap:2px;height:26px}
  .seg{position:relative;flex-basis:0;border-radius:3px;background:#F1F2F3;display:flex;
       align-items:center;justify-content:center;overflow:hidden;transition:background .12s}
  .seg:hover{background:#E7E9EA}
  .seg .lab{font-size:10px;letter-spacing:.05em;color:var(--faint);white-space:nowrap;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
  .seg .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0;transition:width .5s}
  .seg.here{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .seg.here .lab{color:var(--accent);font-weight:600}
  .seg .badge{position:absolute;top:2px;right:3px;min-width:14px;height:14px;border-radius:7px;
    background:var(--amber);color:#FFF;font-family:ui-monospace,Menlo,monospace;font-size:9px;
    line-height:14px;text-align:center;padding:0 3px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(0)}}
  .spine .k{color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
  .spine .k:hover{color:var(--ink);border-color:var(--muted)}
  .spine .count{color:var(--muted);white-space:nowrap}

  .body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 5px var(--insp-w,248px)}
  .body.nopanel{grid-template-columns:1fr 5px}
  .body.nopanel .insp{display:none}
  .resizer{cursor:col-resize;background:var(--hair);position:relative;z-index:9;transition:background .15s}
  .resizer:hover,.resizer.on{background:var(--accent)}
  .resizer:after{content:'';position:absolute;left:-6px;right:-6px;top:0;bottom:0}
  .grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:11px;height:44px;border-radius:6px;background:var(--surface);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:2px;pointer-events:none;
    box-shadow:0 1px 4px -1px rgba(21,24,27,.2);
    transition:background .15s,border-color .15s,height .2s}
  .grip i{display:block;width:1px;height:13px;border-radius:1px;background:var(--faint);transition:background .15s}
  .resizer:hover .grip,.resizer.on .grip{background:var(--accent);border-color:var(--accent)}
  .resizer:hover .grip i,.resizer.on .grip i{background:#FFF}
  .body.nopanel .resizer{background:var(--line)}
  .body.nopanel .grip{height:60px;border-color:var(--muted)}
  .body.nopanel .grip i{background:var(--muted)}
  @media (max-width:880px){.body{grid-template-columns:1fr}.insp,.resizer{display:none}}

  .viewport{position:relative;overflow:hidden;cursor:grab;
    background-color:var(--surface);
    background-image:radial-gradient(circle at 1px 1px, #E3E6E7 1px, transparent 0);
    background-size:26px 26px;touch-action:none;user-select:none}
  .viewport.dragging{cursor:grabbing}
  .world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .world.glide{transition:transform .6s cubic-bezier(.35,.05,.15,1)}
  svg.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:#D2D6D8;stroke-width:1.3}
  .edge.fu{stroke:#E0E3E5;stroke-dasharray:3 4}

  .node{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:9px 11px 9px 13px;line-height:1.35;
    transition:border-color .2s,box-shadow .2s,top .4s cubic-bezier(.35,.05,.15,1),left .4s cubic-bezier(.35,.05,.15,1)}
  .node:hover{border-color:#C0C5C8}
  .node .id{display:block;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;
    letter-spacing:.08em;color:var(--faint);margin-bottom:4px}
  .node .q{font-size:12.5px;display:block;outline:none}
  .node .q[contenteditable="true"]{box-shadow:0 0 0 2px var(--accent-soft);border-radius:3px}
  .node .edge3{position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:transparent;transition:background .35s}

  .node.topic{background:#F4F5F6;border-color:#D2D6D8}
  .node.topic .q{font-weight:600;font-size:12.5px}
  .node.topic .id{color:var(--muted)}
  .node.topic .mins{display:block;margin-top:5px;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--faint)}
  .node.opener{background:var(--accent-soft);border-color:#CBDBFB}
  .node.opener .id{color:var(--accent)} .node.opener .q{font-weight:500}
  .node.probe{border-style:dotted} .node.probe .q{color:#5C6469}
  .node.follow{background:#FCFCFD;border-color:var(--hair)}
  .node.follow .q{font-size:12px;color:#4A5257}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,95,217,.13)}

  .node.dragging{opacity:.92;z-index:30;cursor:grabbing;
    box-shadow:0 18px 40px -18px rgba(21,24,27,.55);transition:none;transform:rotate(-.5deg)}

  .live .node[data-s="red"] .edge3{background:var(--red)}
  .live .node[data-s="amber"] .edge3{background:var(--amber)}
  .live .node[data-s="green"] .edge3{background:var(--green)}
  .live .node.cur{border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,24,27,.1)}
  .live .node.next{border-color:var(--muted);border-style:dashed}

  /* node controls */
  .ctl{position:absolute;top:-10px;right:6px;display:none;gap:2px;z-index:12}
  .editing .node:hover .ctl,.editing .node.sel .ctl{display:flex}
  .editing .node{cursor:grab}
  .editing .node .q{cursor:text}
  .ctl button{width:19px;height:19px;border:1px solid var(--line);border-radius:50%;background:var(--surface);
    color:var(--muted);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px -2px rgba(21,24,27,.25)}
  .ctl button:hover{border-color:var(--ink);color:var(--ink)}
  .ctl button.del:hover{border-color:var(--red);color:var(--red)}

  .fold{position:absolute;display:flex;align-items:center;justify-content:center;gap:3px;height:19px;
    padding:0 7px;border:1px solid var(--line);border-radius:20px;background:var(--surface);
    font-family:ui-monospace,Menlo,monospace;font-size:9.5px;color:var(--muted);z-index:2;
    transition:top .4s cubic-bezier(.35,.05,.15,1),left .4s cubic-bezier(.35,.05,.15,1)}
  .fold:hover{border-color:var(--muted);color:var(--ink)}
  .fold svg{width:7px;height:7px;transition:transform .18s}
  .fold[aria-expanded="true"] svg{transform:rotate(90deg)}

  .ghost{position:absolute;height:26px;display:none;align-items:center;gap:6px;padding:0 10px;
    border:1px dashed #CFD4D7;border-radius:6px;color:var(--faint);
    font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;
    background:rgba(255,255,255,.6);opacity:.55;
    transition:top .4s cubic-bezier(.35,.05,.15,1),opacity .15s,border-color .15s}
  .editing .ghost{display:flex}
  .ghost:hover{opacity:1;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .dropline{position:absolute;height:2px;background:var(--accent);border-radius:2px;z-index:25;display:none}
  .dropline:before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;
    border-radius:50%;background:var(--accent)}

  /* annotation layer */
  .layer-notes .fold,.layer-notes .ghost{opacity:.18;pointer-events:none;filter:grayscale(.6)}
  .layer-notes .node{opacity:.18;filter:grayscale(.6);
    transition:opacity .16s ease,filter .16s ease,border-color .2s,box-shadow .2s,
      top .4s cubic-bezier(.35,.05,.15,1),left .4s cubic-bezier(.35,.05,.15,1)}
  .layer-notes .node:hover{opacity:1;filter:none;z-index:3}
  .layer-notes .node .ctl{display:none}
  .layer-notes .edges{opacity:.35}
  .annolayer{position:absolute;top:0;left:0;z-index:4;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease}
  .layer-notes .annolayer{opacity:1;visibility:visible;pointer-events:auto}
  svg.leads{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .lead{stroke:#C9CFD2;stroke-width:1;stroke-dasharray:2 3;fill:none}

  .anode{position:absolute;width:250px;background:var(--surface);border:1px solid var(--line);
    border-left:2px solid var(--green);border-radius:5px;padding:7px 9px;font-size:11px;line-height:1.45;
    color:#3F474C;box-shadow:0 10px 26px -16px rgba(21,24,27,.5);animation:slip .3s ease;
    transition:top .4s cubic-bezier(.35,.05,.15,1)}
  .anode .m{display:flex;gap:6px;align-items:baseline;font-family:ui-monospace,Menlo,monospace;
    font-size:9px;letter-spacing:.07em;color:var(--faint);margin-bottom:3px}
  .anode .m .src{margin-left:auto;color:#B7BDC1}
  .anode.ahead{border-left-color:var(--amber)} .anode.ahead .m{color:#B08A3C}
  .anode.flag{border-left-color:var(--amber);border-left-style:dotted} .anode.flag .m{color:#B08A3C}
  .anode .tx{outline:none;border-radius:2px}
  .anode .tx:focus{box-shadow:0 0 0 2px var(--accent-soft)}

  .sticky{position:absolute;width:186px;background:#FDF6D8;border:1px solid #E9DCA6;border-radius:4px;
    padding:0 0 8px;box-shadow:0 12px 26px -16px rgba(21,24,27,.5);animation:slip .25s ease;cursor:grab}
  .sticky.grabbing{cursor:grabbing}
  .sticky .top{display:flex;align-items:center;gap:6px;padding:5px 7px 3px;
    font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.07em;color:#A79A62}
  .sticky .top .sp{flex:1}
  .sticky .del{color:#B3A76D;font-size:12px;line-height:1;padding:0 2px}
  .sticky .del:hover{color:#8A7C3C}
  .sticky .tx{padding:0 9px;font-size:12px;line-height:1.4;color:#4A4526;outline:none;min-height:34px}
  .sticky .tx:empty:before{content:attr(data-ph);color:#BCB183}

  .zoomctl{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:1px;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;overflow:hidden;z-index:8}
  .zoomctl button{padding:5px 9px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .zoomctl button:hover{background:#F4F5F6;color:var(--ink)}
  .zoomctl .z{padding:5px 6px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;font-size:10px;min-width:42px;text-align:center}
  .hint{position:absolute;right:12px;bottom:12px;z-index:5;font-size:10px;color:var(--faint);
    background:rgba(255,255,255,.85);border-radius:4px;padding:3px 7px}

  .dock{position:absolute;left:12px;top:50%;transform:translateY(-50%);z-index:6;
    display:flex;flex-direction:column;gap:5px;padding:6px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:11px;
    box-shadow:0 12px 30px -18px rgba(21,24,27,.4)}
  .dock .dgrp{display:flex;flex-direction:column;gap:4px}
  .dock .dsep{height:1px;background:var(--hair);margin:3px 5px}
  .dbtn{position:relative;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);border:1px solid transparent}
  .dbtn:hover{background:#F4F5F6;color:var(--ink)}
  .dbtn.on{background:var(--accent-soft);color:var(--accent);border-color:#CBDBFB}
  .dbtn svg{width:18px;height:18px}
  .dbtn[disabled]{opacity:.32;cursor:default}
  .dbtn.rec{color:var(--red)}
  .app.recording .dbtn.rec{animation:pulse 1s infinite}
  .dbtn .dtip{position:absolute;left:43px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:rgba(21,24,27,.95);color:#F3F4F5;font-size:11px;padding:4px 8px;border-radius:6px;
    display:none;align-items:center;gap:7px;pointer-events:none;z-index:2;box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
  .dbtn:hover .dtip{display:flex}
  .dbtn[disabled]:hover .dtip{display:none}
  .dbtn .dtip b{font-family:ui-monospace,Menlo,monospace;font-size:9px;font-weight:400;
    background:rgba(255,255,255,.18);border-radius:3px;padding:1px 5px}

  .mindmap-scene{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;display:none;
    text-align:center;pointer-events:none;color:var(--muted);
    background:rgba(255,255,255,.88);border:1px solid var(--hair);border-radius:20px;padding:5px 13px;
    font-size:11px;line-height:1.3;box-shadow:0 8px 20px -14px rgba(21,24,27,.4)}
  .mindmap-scene .mm-big{display:none}
  .mindmap-scene span{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.1em;color:var(--faint)}
  .app.layer-mindmap .mindmap-scene{display:block}

  .worldnote{position:absolute;width:190px;z-index:5;display:none;cursor:pointer;
    background:#FBF7E4;border:1px solid #E4D9A6;border-left:3px solid #8B5CF6;border-radius:6px;padding:6px 9px;
    font-size:11px;line-height:1.4;color:#4A4526;box-shadow:0 12px 26px -16px rgba(21,24,27,.5)}
  .worldnote:hover{border-color:#8B5CF6}
  .worldnote .wn-h{font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.07em;color:#B08A3C;margin-bottom:3px}
  .app.layer-mindmap .worldnote{display:block}

  /* page notes — connectable sticky notes that live on the canvas */
  svg.conns{position:absolute;top:0;left:0;overflow:visible}
  .conn{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.75;pointer-events:none}
  .conn.temp{stroke-dasharray:5 4;opacity:.9}
  .conn-hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
  .pnote{position:absolute;width:184px;min-height:46px;z-index:6;box-sizing:border-box;
    background:#FDF6D8;border:1px solid #E4D9A6;border-radius:7px;padding:9px 11px 10px;
    font-size:12px;line-height:1.45;color:#4A4526;box-shadow:0 12px 26px -16px rgba(21,24,27,.5);cursor:grab}
  .pnote.grabbing{cursor:grabbing}
  .pnote.mm{border-left:3px solid #8B5CF6}
  .pnote.collapsed{width:16px;height:16px;min-height:0;padding:0;border:2px solid var(--surface);border-radius:50%;
    background:#8B5CF6;box-shadow:0 3px 9px -2px rgba(139,92,246,.6);cursor:pointer;overflow:visible;
    transition:width .12s,height .12s}
  .pnote.collapsed > *{display:none!important}
  .pnote.collapsed:hover{transform:scale(1.18)}
  .conn.faint{stroke:#8B5CF6;opacity:.42;stroke-width:1.3}
  .pnote .pn-tx{outline:none;min-height:20px}
  .pnote .pn-tx:empty:before{content:attr(data-ph);color:#BCB183}
  .pnote .pn-corner,.pnote .pn-del{position:absolute;top:3px;width:17px;height:17px;border-radius:4px;
    display:flex;align-items:center;justify-content:center;color:#B0A46A;opacity:0;transition:opacity .12s}
  .pnote .pn-corner{right:21px} .pnote .pn-del{right:3px;font-size:15px;line-height:1}
  .pnote:hover .pn-corner,.pnote:hover .pn-del{opacity:1}
  .pnote .pn-corner:hover{background:rgba(139,92,246,.16);color:#7A5CC7}
  .pnote.mm .pn-corner{opacity:1;color:#8B5CF6}
  .pnote .pn-del:hover{background:rgba(196,105,90,.14);color:#B04A3A}
  .pnote .pn-corner svg{width:12px;height:12px}
  .pdot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--accent);
    border:2px solid var(--surface);opacity:0;transition:opacity .12s,transform .1s;cursor:crosshair;z-index:8}
  .pnote:hover .pdot{opacity:.9} .pdot:hover{transform:scale(1.35);opacity:1}
  .pdot.t{top:-6px;left:50%;margin-left:-5.5px} .pdot.b{bottom:-6px;left:50%;margin-left:-5.5px}
  .pdot.l{left:-6px;top:50%;margin-top:-5.5px} .pdot.r{right:-6px;top:50%;margin-top:-5.5px}
  :root[data-theme="dark"] .pnote{background:#2A2620;border-color:#4A4330;color:#E7DFC6}
  :root[data-theme="dark"] .pnote .pn-tx:empty:before{color:#8A805E}
  .node.linktarget{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}

  .transport{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:7;
    display:flex;align-items:center;gap:13px;padding:7px 17px;
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 16px 38px -18px rgba(21,24,27,.45);transition:bottom .25s ease}
  .app.live .transport{bottom:182px}
  .transport button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--muted);border:1px solid transparent}
  .transport button:hover{background:rgba(0,0,0,.05);color:var(--ink)}
  .transport button svg{width:15px;height:15px;display:block}
  .transport .primary{color:var(--accent)}
  .transport .primary:hover{background:var(--accent-soft)}
  .transport .primary.on{color:var(--red)}
  .transport .primary.on:hover{background:rgba(196,105,90,.12)}
  :root[data-theme="dark"] .transport button:hover{background:rgba(255,255,255,.08)}
  .transport .tsep{width:1px;height:20px;background:var(--line);margin:0 2px;flex:none}
  .transport .srcSel{font:inherit;font-size:11px;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:13px;padding:4px 8px;cursor:pointer;outline:none}
  .transport .srcSel:hover{color:var(--ink);border-color:var(--muted)}
  .transport #liveBtn{color:var(--muted)}
  .transport #liveBtn.on{color:var(--red);animation:pulse 1.6s infinite}
  .app.live-real .transport .primary.on{color:var(--red)}

  .filemenu{position:absolute;left:12px;top:52px;z-index:8}
  .filebtn{display:flex;align-items:center;gap:6px;max-width:210px;padding:5px 9px;
    background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--ink);font-size:12px}
  .filebtn:hover{border-color:var(--muted)}
  .filebtn .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filebtn .fi{width:13px;height:13px;color:var(--muted);flex:none}
  .filebtn .fchev{width:11px;height:11px;color:var(--faint);flex:none;transition:transform .15s}
  .filemenu.open .fchev{transform:rotate(180deg)}
  .filelist{margin-top:5px;width:236px;max-height:44vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--line);border-radius:9px;box-shadow:0 18px 44px -18px rgba(21,24,27,.42);padding:5px}
  .filelist[hidden]{display:none}
  .filelist .flhd{padding:4px 8px 6px;font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.1em;color:var(--faint)}
  .filerow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
  .filerow:hover{background:var(--hair)}
  .filerow.on{background:var(--accent-soft);color:var(--accent)}
  .filerow .fdot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
  .filerow.on .fdot{background:var(--accent)}
  .filerow .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;outline:none;border-radius:3px}
  .filerow .fn[contenteditable="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft);padding:0 3px;text-overflow:clip}
  .filerow .fx{color:var(--faint);font-size:15px;line-height:1;flex:none;opacity:0;padding:0 2px}
  .filerow:hover .fx{opacity:1}
  .filerow .fx:hover{color:var(--red)}
  .filenew{display:flex;align-items:center;gap:8px;padding:7px 8px;margin-top:4px;
    border-top:1px solid var(--hair);color:var(--accent);font-size:12.5px;cursor:pointer;border-radius:0 0 6px 6px}
  .filenew:hover{background:var(--accent-soft)}
  .filenew svg{width:13px;height:13px;flex:none}
  .transport .tlive{display:none;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;
    font-size:10px;letter-spacing:.08em;color:var(--red)}
  .app.live .transport .tlive{display:flex}
  .transport .tlive i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
  .app.live.recording .transport .tlive{color:var(--red)}

  .qnote{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:9;display:none;
    max-width:440px;align-items:flex-start;gap:10px;padding:9px 12px 9px 13px;border-radius:10px;
    background:rgba(21,24,27,.96);color:#F3F4F5;box-shadow:0 16px 40px -16px rgba(0,0,0,.55)}
  .qnote.active{display:flex;animation:slidedown .3s ease}
  .qnote .qi{flex:none;color:var(--green);font-size:15px;line-height:1.25;margin-top:1px}
  .qnote .qc{min-width:0}
  .qnote .ql{font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.09em;color:#9AA0A5;margin-bottom:2px}
  .qnote .qt{font-size:12px;line-height:1.4}
  .qnote .qx{flex:none;color:#9AA0A5;font-size:16px;line-height:1;padding:0 2px;margin-left:4px}
  .qnote .qx:hover{color:#F3F4F5}
  @keyframes slidedown{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

  .tl-mark.q{background:var(--green)}
  .node.qadded{border-color:var(--green);border-style:dashed;background:rgba(78,154,107,.12)}
  .node.qadded .id{color:var(--green)}
  .node.qadded .q{color:#2F6B49}
  :root[data-theme="dark"] .node.qadded{background:rgba(95,180,131,.16)}
  :root[data-theme="dark"] .node.qadded .q{color:#9BD9B4}
  .livenote.q .ln-top:before{background:var(--green)}

  .rater{position:absolute;z-index:8;display:none;gap:3px;padding:5px;transform:translateX(-50%);
    background:rgba(21,24,27,.96);border-radius:10px;box-shadow:0 16px 36px -16px rgba(0,0,0,.6)}
  .rater.active{display:flex}
  .rater:after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:rgba(21,24,27,.96);border-bottom:0}
  .rbtn{position:relative;width:36px;height:36px;border-radius:7px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;color:#E8EAEB}
  .rbtn:hover{background:rgba(255,255,255,.13)}
  .rbtn .ri{font-size:15px;line-height:1}
  .rbtn .rn{font-family:ui-monospace,Menlo,monospace;font-size:8px;color:#9AA0A5}
  .rbtn .rtip{position:absolute;top:-23px;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:rgba(21,24,27,.96);color:#F3F4F5;font-size:10px;padding:2px 6px;border-radius:4px;display:none}
  .rbtn:hover .rtip{display:block}
  .tl-rec .rbadge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;line-height:1;
    font-weight:700;text-shadow:0 1px 2px rgba(255,255,255,.6);pointer-events:none}

  .toasts{position:absolute;top:12px;right:12px;z-index:8;display:flex;flex-direction:column;gap:6px;width:252px}
  .toast{display:block;width:100%;text-align:left;background:rgba(255,255,255,.97);border:1px solid var(--line);
    border-left:2px solid var(--amber);border-radius:5px;padding:7px 9px;font-size:11px;line-height:1.4;
    color:#4C545A;cursor:pointer;box-shadow:0 10px 26px -14px rgba(21,24,27,.4);
    animation:slidein .3s ease;transition:opacity .3s,transform .3s}
  .toast .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
  .toast .hd b{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;color:var(--amber);font-weight:500}
  .toast .hd span{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.08em;color:var(--faint);margin-left:auto}
  .toast.out{opacity:0;transform:translateX(12px)}
  @keyframes slidein{from{opacity:0;transform:translateX(14px)}}
  @keyframes slip{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  .caps{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:10px 14px 9px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--hair);
    display:flex;flex-direction:column;gap:4px}
  .caps[hidden]{display:none}
  .line{display:flex;gap:9px;align-items:baseline;line-height:1.4;animation:slip .25s ease}
  .line .who{flex:none;width:74px;text-align:right;font-family:ui-monospace,Menlo,monospace;
    font-size:9.5px;letter-spacing:.08em;color:var(--faint);padding-top:2px}
  .line.a .who{color:var(--accent)}
  .line .txt{font-size:13px;color:#767D82}
  .line:last-of-type .txt{color:var(--ink)}
  .status{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:10px;color:var(--faint);
    border-top:1px solid var(--hair);padding-top:6px}
  .status .dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.6s infinite}
  .caps.paused .status .dot{animation:none;background:var(--muted)}
  .caps.paused .status .rec{color:var(--muted)}
  .status .spacer{flex:1}
  @keyframes pulse{50%{opacity:.3}}

  .tl{display:flex;align-items:center;gap:11px;margin-top:6px;padding-top:8px;padding-bottom:12px;border-top:1px solid var(--hair)}
  .tl-live{flex:none;display:flex;align-items:center;gap:5px;font-family:ui-monospace,Menlo,monospace;
    font-size:9px;letter-spacing:.09em;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:3px 8px}
  .tl-live:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .tl:not(.reviewing) .tl-live:before{background:var(--red);animation:pulse 1.6s infinite}
  .tl.reviewing .tl-live{color:var(--accent);border-color:var(--accent);cursor:pointer}
  .tl.reviewing .tl-live:before{background:var(--accent);animation:none}
  .tl-track{position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .tl-track:before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;border-radius:2px;background:#E7E9EA}
  .tl-elapsed,.tl-played{position:absolute;left:0;top:50%;transform:translateY(-50%);height:4px;border-radius:2px}
  .tl-elapsed{background:#CDD2D5;transition:width .4s linear}
  .tl-played{background:var(--accent);transition:width .12s linear}
  .tl.reviewing .tl-played{background:var(--muted);transition:none}
  .tl-future{position:absolute;top:50%;transform:translateY(-50%);left:93%;right:0;height:4px;border-radius:2px;
    background:repeating-linear-gradient(90deg,#DDE0E2 0 3px,transparent 3px 7px);opacity:.85}
  .tl-future:after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:5px;
    border-radius:50%;background:var(--accent);opacity:.5;animation:pulse 1.6s infinite}
  .tl.reviewing .tl-future:after{animation:none;opacity:.25}
  .tl-mark{position:absolute;transform:translateX(-50%);width:8px;padding:0;border:none;border-radius:1px;
    cursor:pointer;z-index:2;pointer-events:auto;background:var(--amber);
    transition:width .09s ease,filter .12s ease}
  .tl-mark:hover{filter:brightness(1.08)}
  .tl-head{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;
    background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 5px -1px rgba(21,24,27,.45);z-index:3;cursor:grab;
    transition:left .12s linear}
  .tl:not(.reviewing) .tl-head{animation:pulse 1.6s infinite}
  .tl.reviewing .tl-head{background:var(--accent);cursor:grabbing;transition:none}
  .tl-time{flex:none;color:var(--faint);font-size:10px;min-width:38px;text-align:right}
  .tl-mark.user{background:#8B5CF6}
  .tl-rec{position:absolute;transform:none;border:none;padding:0;border-radius:3px;pointer-events:auto;cursor:pointer;z-index:1;
    background:rgba(196,105,90,.55);box-shadow:inset 0 0 0 1px rgba(196,105,90,.7)}
  .tl-rec.live{animation:pulse 1.2s infinite}
  .tl.recording .tl-live{color:var(--red);border-color:var(--red)}
  .tl.recording .tl-live:before{background:var(--red);animation:pulse 1s infinite}
  .tl-tip{position:absolute;z-index:9;max-width:236px;background:rgba(21,24,27,.95);color:#F3F4F5;
    font-size:10.5px;line-height:1.42;padding:6px 9px;border-radius:5px;white-space:pre-line;
    transform:translateX(-50%);pointer-events:none;box-shadow:0 10px 26px -14px rgba(0,0,0,.55)}
  .tl-tip[hidden]{display:none}
  .tl-tip .tt-h{display:block;font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.08em;color:#AEB4B9;margin-bottom:3px}

  .livenote{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:236px;z-index:7;
    background:#FDF6D8;border:1px solid #E9DCA6;border-radius:6px;box-shadow:0 20px 44px -18px rgba(21,24,27,.55);
    padding:0 0 9px;animation:slip .2s ease}
  .livenote.out{opacity:0;transform:translate(-50%,-58%);transition:opacity .24s ease,transform .24s ease}
  .livenote .ln-top{display:flex;align-items:center;gap:5px;padding:6px 10px 4px;
    font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.08em;color:#A79A62}
  .livenote .ln-top:before{content:'';width:6px;height:6px;border-radius:50%;background:#8B5CF6}
  .livenote .ln-tx{padding:0 10px;font-size:12.5px;line-height:1.45;color:#4A4526;outline:none;min-height:40px}
  .livenote .ln-tx:empty:before{content:attr(data-ph);color:#BCB183}
  .livenote .ln-log{padding:0 10px;margin-bottom:5px;max-height:132px;overflow-y:auto}
  .livenote .ln-past{font-size:11.5px;line-height:1.4;color:#6E683F;background:rgba(255,255,255,.5);
    border:1px solid #E4D9A6;border-radius:4px;padding:4px 7px;margin-bottom:4px}
  .livenote .ln-cont{padding:0 10px 3px;font-family:ui-monospace,Menlo,monospace;font-size:8px;letter-spacing:.08em;color:#B4A968}

  .insp{padding:14px 0 16px;overflow-y:auto;min-height:0;min-width:0}
  .kicker{padding:0 14px;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-bottom:9px}
  .fld{padding:0 14px 14px}
  .fld label{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .qbox{font-size:12.5px;line-height:1.4;outline:none;border:1px solid transparent;border-radius:4px;padding:3px 5px;margin:-3px -5px}
  .qbox:hover{border-color:var(--hair)}
  .qbox:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{border:1px solid var(--hair);border-radius:3px;padding:2px 6px;font-size:11px;color:#4C545A;background:#FBFBFC}
  .tag.add{border-style:dashed;color:var(--faint);cursor:pointer}
  .tag{display:inline-flex;align-items:center;gap:3px}
  .tag .tagx{color:var(--faint);font-size:12px;line-height:1;padding:0 1px;margin-left:1px}
  .tag .tagx:hover{color:var(--red)}
  .tag-input{border:1px solid var(--accent);border-radius:3px;padding:1px 5px;font-size:11px;outline:none;width:78px;color:var(--ink);background:var(--surface)}
  .ai-btn{float:right;font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.04em;
    color:var(--accent);background:var(--accent-soft);border:1px solid #CBDBFB;border-radius:4px;padding:1px 6px}
  .ai-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .ai-btn.busy{opacity:.6}
  .sens{display:flex;align-items:center;gap:9px}
  .sens input{flex:1;accent-color:var(--accent)}
  .sens .v{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted);width:28px}
  .hr{height:1px;background:var(--hair);margin:0 14px 14px}
  .notes{padding:0 14px}
  .note{border:1px solid var(--hair);border-left:2px solid var(--amber);border-radius:4px;padding:6px 8px;
    margin-bottom:6px;font-size:11px;line-height:1.4;color:#4C545A;animation:slip .3s ease;cursor:pointer;
    display:block;width:100%;text-align:left}
  .note:hover{border-color:var(--line)}
  .note b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.08em;
    color:var(--faint);font-weight:400;margin-bottom:2px}
  .empty{padding:0 14px;font-size:11px;color:var(--faint);line-height:1.5}

  .foot{display:flex;align-items:center;gap:14px;padding:7px 14px;border-top:1px solid var(--hair);
    font-size:11px;color:var(--faint);flex:none}
  .foot .lg{display:flex;align-items:center;gap:6px}
  .foot .sw{width:16px;height:8px;border-radius:2px;border:1px solid var(--line)}
  .foot .sw.o{background:var(--accent-soft);border-color:#CBDBFB}
  .foot .sw.p{border-style:dotted}
  .foot .sw.r,.foot .sw.am,.foot .sw.g{border:none;width:3px;height:12px;border-radius:2px}
  .foot .sw.r{background:var(--red)} .foot .sw.am{background:var(--amber)} .foot .sw.g{background:var(--green)}
  .foot .spacer{flex:1}

  .scrim{position:absolute;inset:0;background:rgba(21,24,27,.14);z-index:40;display:flex;justify-content:center;padding-top:80px}
  .scrim[hidden]{display:none}
  .pal{width:560px;max-width:92%;background:var(--surface);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 24px 60px -24px rgba(21,24,27,.4);overflow:hidden;height:fit-content}
  .pal input{width:100%;border:none;outline:none;padding:13px 15px;font-size:14px;border-bottom:1px solid var(--hair);background:none}
  .pal ul{list-style:none;margin:0;padding:5px;max-height:300px;overflow-y:auto}
  .pal li{padding:7px 10px;border-radius:5px;display:flex;gap:10px;align-items:baseline;cursor:pointer}
  .pal li.on{background:var(--accent-soft)}
  .pal li .pid{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--faint);flex:none;width:52px}
  .pal li.on .pid{color:var(--accent)}
  .pal li .ptx{font-size:12.5px;line-height:1.3}
  .pal li .ptp{margin-left:auto;flex:none;font-size:10px;color:var(--faint)}
  .pal .none{padding:14px 15px;font-size:12px;color:var(--faint)}

  /* ---------- dark mode ---------- */
  :root[data-theme="dark"]{
    --surface:#16191C; --ink:#E7EAEC; --muted:#8A9198; --faint:#646B71;
    --line:#2C3238; --hair:#22272C; --accent:#5B8CFF; --accent-soft:#1C2942;
    --red:#D77B6C; --amber:#D9AC5A; --green:#5FB483;
  }
  :root[data-theme="dark"] .viewport{background-color:var(--surface);
    background-image:radial-gradient(circle at 1px 1px,#2A2F34 1px,transparent 0)}
  :root[data-theme="dark"] .seg{background:#22272C}
  :root[data-theme="dark"] .seg:hover{background:#2A3036}
  :root[data-theme="dark"] .seg2 button[aria-pressed="false"] .cnt{background:#2A3036;color:var(--faint)}
  :root[data-theme="dark"] .node{background:#1B1F23}
  :root[data-theme="dark"] .node.topic{background:#20252A;border-color:#333A41}
  :root[data-theme="dark"] .node.follow{background:#191D21}
  :root[data-theme="dark"] .node.follow .q{color:#AAB2B8}
  :root[data-theme="dark"] .node.probe .q{color:#98A0A6}
  :root[data-theme="dark"] .node.opener{border-color:#2E4270}
  :root[data-theme="dark"] .edge{stroke:#3A4045}
  :root[data-theme="dark"] .edge.fu{stroke:#33383D}
  :root[data-theme="dark"] .caps{background:rgba(22,25,28,.9)}
  :root[data-theme="dark"] .hint{background:rgba(22,25,28,.85)}
  :root[data-theme="dark"] .toast{background:rgba(28,32,36,.97);color:#C7CDD2}
  :root[data-theme="dark"] .transport{background:rgba(24,28,32,.95)}
  :root[data-theme="dark"] .dock{background:rgba(24,28,32,.92)}
  :root[data-theme="dark"] .mindmap-scene{background:rgba(24,28,32,.9)}
  :root[data-theme="dark"] .grip{background:var(--surface)}
  :root[data-theme="dark"] .tag{background:#1E2226}
  :root[data-theme="dark"] .line .txt{color:#9AA1A7}
  :root[data-theme="dark"] .anode{background:#1B1F23;color:#B8BEC3}
  :root[data-theme="dark"] .zoomctl{background:var(--surface)}
  :root[data-theme="dark"] .zoomctl button:hover{background:#22272C}
  :root[data-theme="dark"] .pal li.on{background:var(--accent-soft)}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="spine">
    <div class="track" id="track"></div>
    <button class="k mono" id="palBtn">⌘K</button>
  </div>

  <div class="body">
    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <svg class="edges" id="edges"></svg>
        <svg class="conns" id="conns"></svg>
        <div class="dropline" id="dropline"></div>
        <div class="annolayer" id="annolayer"><svg class="leads" id="leads"></svg></div>
      </div>
      <div class="mindmap-scene" id="mindmapScene"><div>🧠 Mind map · your notes land here <span>EARLY</span></div></div>

      <div class="qnote" id="qnote"></div>

      <div class="rater" id="rater">
        <button class="rbtn" data-rate="1"><span class="ri" style="color:#5FB483">★</span><span class="rn">1</span><span class="rtip">Interesting</span></button>
        <button class="rbtn" data-rate="2"><span class="ri" style="color:#D77B6C">≠</span><span class="rn">2</span><span class="rtip">Doesn't add up</span></button>
        <button class="rbtn" data-rate="3"><span class="ri" style="color:#6FA0F5">?</span><span class="rn">3</span><span class="rtip">Question mark</span></button>
        <button class="rbtn" data-rate="note"><span class="ri" style="color:#B79CF7">✎</span><span class="rn">N</span><span class="rtip">Custom note</span></button>
      </div>

      <div class="dock" id="dock">
        <div class="dgrp">
          <button class="dbtn" data-act="edit" aria-label="Edit mode">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.3 4.2l2.5 2.5M12 5.5 4.5 13l-1.1 3.6 3.6-1.1L14.5 8z"/></svg>
            <span class="dtip">Edit<b>E</b></span>
          </button>
        </div>
        <div class="dsep"></div>
        <div class="dgrp">
          <button class="dbtn" data-act="note" aria-label="Add note">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h6l4 4v10H5z"/><path d="M11 3v4h4M8 11h5M8 14h4"/></svg>
            <span class="dtip">Add note<b>N</b></span>
          </button>
          <button class="dbtn live-act" data-act="question" aria-label="Add question">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 3 1.7c-.7.5-1 .9-1 1.8M10 14.2h.01"/></svg>
            <span class="dtip">Add question<b>Q</b></span>
          </button>
          <button class="dbtn rec live-act" data-act="record" aria-label="Record clip">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="currentColor"/></svg>
            <span class="dtip">Tap 10s · hold for longer<b>R</b></span>
          </button>
        </div>

se}]},{"id":"s2-3","t":"Q2.3  What does prototyping look like in your workflow?","probe":false,"f":[{"id":"f2-3-1","t":"↳ What do you mock up in-house versus send out?","probe":false},{"id":"f2-3-2","t":"↳ How many physical iterations before you are confident?","probe":false}]},{"id":"s2-4","t":"Q2.4  How do you know a design is done?","probe":false,"f":[{"id":"f2-4-1","t":"↳ Who signs off, and on what evidence?","probe":false}]}]},"3":{"head":"3 · CAD TOOLS & HISTORY   ~4 min","main":"\"What are you modelling in day to day, and how did you end up on that tool?\"","qs":[{"id":"s3-1","t":"Q3.1  What else have you used seriously, and why did you move?","probe":false,"f":[{"id":"f3-1-1","t":"↳ What did you lose in the switch?","probe":false},{"id":"f3-1-2","t":"↳ How long until you were fast again?","probe":false}]},{"id":"s3-2","t":"Q3.2  If the choice were entirely yours, no legacy files, no team, what would you use?","probe":false,"f":[{"id":"f3-2-1","t":"↳ What specifically does it do better?","probe":false},{"id":"f3-2-2","t":"↳ What would you still keep a second tool around for?","probe":true}]},{"id":"s3-3","t":"Q3.3  Do you run more than one package concurrently?","probe":false,"f":[{"id":"f3-3-1","t":"↳ How do you decide which job goes where?","probe":false},{"id":"f3-3-2","t":"↳ What breaks when you move geometry between them?","probe":false}]},{"id":"s3-4","t":"Q3.4  How do you drive the model: mouse, SpaceMouse, shortcuts, macros?","probe":false,"f":[{"id":"f3-4-1","t":"↳ Have you customised your keymap or UI, and how far?","probe":false},{"id":"f3-4-2","t":"↳ How much of your speed is setup versus practice?","probe":true}]}]},"4":{"head":"4 · MODELLING PHILOSOPHY   ~4 min","main":"\"When you open a new part file, how do you decide how to build it?\"","qs":[{"id":"s4-1","t":"Q4.1  Parametric or direct? Does it depend on the stage of the project?","probe":false,"f":[{"id":"f4-1-1","t":"↳ When has a fully parametric approach cost you time?","probe":false},{"id":"f4-1-2","t":"↳ When has it saved a project?","probe":false}]},{"id":"s4-2","t":"Q4.2  How much surfacing do you do, and how comfortable are you in it?","probe":false,"f":[{"id":"f4-2-1","t":"↳ Where does solid modelling stop being enough?","probe":false},{"id":"f4-2-2","t":"↳ How do you judge surface quality: zebra, curvature combs, or eye?","probe":false}]},{"id":"s4-3","t":"Q4.3  How disciplined is your feature tree?","probe":false,"f":[{"id":"f4-3-1","t":"↳ Do you organise features for other people, or just yourself?","probe":false},{"id":"f4-3-2","t":"↳ Honest reaction to inheriting someone else's messy tree","probe":true}]},{"id":"s4-4","t":"Q4.4  What does good CAD mean to you beyond the shape being right?","probe":false,"f":[{"id":"f4-4-1","t":"↳ How do you build for a revision you know is coming?","probe":false},{"id":"f4-4-2","t":"↳ Ever rebuilt from scratch rather than fix it? What tipped it?","probe":true}]}]},"5":{"head":"5 · PIPELINE OUT OF CAD   ~4 min","main":"\"Once the geometry exists, what happens to it? Walk me through everything downstream.\"","qs":[{"id":"s5-1","t":"Q5.1  Rendering and visualisation: what tool, and who is the audience?","probe":false,"f":[{"id":"f5-1-1","t":"↳ Native renderer, or something dedicated?","probe":false},{"id":"f5-1-2","t":"↳ How long does a client-ready image actually take?","probe":false}]},{"id":"s5-2","t":"Q5.2  Simulation and analysis: do you run any yourself?","probe":false,"f":[{"id":"f5-2-1","t":"↳ Where do you stop and hand it to an engineer?","probe":false},{"id":"f5-2-2","t":"↳ How much do you trust results you did not set up?","probe":true}]},{"id":"s5-3","t":"Q5.3  CAM, print prep, and physical output","probe":false,"f":[{"id":"f5-3-1","t":"↳ Which slicer or CAM package, and how much do you tune it?","probe":false},{"id":"f5-3-2","t":"↳ How does the export stay tied to the source model version?","probe":false}]},{"id":"s5-4","t":"Q5.4  Drawings, tolerancing, and interop formats","probe":false,"f":[{"id":"f5-4-1","t":"↳ STEP, Parasolid, native: what goes to vendors, what goes wrong?","probe":false},{"id":"f5-4-2","t":"↳ Where does the handoff to engineering or the factory break?","probe":false}]},{"id":"s5-5","t":"Q5.5  Do you script or use plugins anywhere in this chain?","probe":false,"f":[{"id":"f5-5-1","t":"↳ What have you automated, and was it worth the time to build?","probe":false}]}]},"6":{"head":"6 · FILES, VERSIONING, COLLABORATION   ~4 min","main":"\"How is your project data organised? Where do files live, and who can touch them?\"","qs":[{"id":"s6-1","t":"Q6.1  PDM/PLM, cloud CAD, or folders on a drive?","probe":false,"f":[{"id":"f6-1-1","t":"↳ Who chose that, and would you change it?","probe":false},{"id":"f6-1-2","t":"↳ What does it cost you in daily friction?","probe":true}]},{"id":"s6-2","t":"Q6.2  What are your naming and version conventions?","probe":false,"f":[{"id":"f6-2-1","t":"↳ Does the rest of the team follow them?","probe":false},{"id":"f6-2-2","t":"↳ What happens when someone does not?","probe":true}]},{"id":"s6-3","t":"Q6.3  Ever worked in the same model concurrently with someone else?","probe":false,"f":[{"id":"f6-3-1","t":"↳ How did conflicts get resolved?","probe":false},{"id":"f6-3-2","t":"↳ Would you want real-time multiplayer CAD, or is that a bad idea?","probe":true}]},{"id":"s6-4","t":"Q6.4  Data you have lost, or a file that broke badly","probe":false,"f":[{"id":"f6-4-1","t":"↳ What changed in your process afterward?","probe":false}]}]},"7":{"head":"7 · AI IN THE WORKFLOW   ~4 min","main":"\"Where does AI show up in your work today, if at all? Concretely, this month.\"","qs":[{"id":"s7-1","t":"Q7.1  What have you actually used it for?","probe":false,"f":[{"id":"f7-1-1","t":"↳ Which tools specifically?","probe":false},{"id":"f7-1-2","t":"↳ What made you stop using something you tried?","probe":true}]},{"id":"s7-2","t":"Q7.2  Generative design and text-to-CAD: have you tried them?","probe":false,"f":[{"id":"f7-2-1","t":"↳ Usable <script>
(function () {
  'use strict';

  var TREE = JSON.parse(document.getElementById('treedata').textContent);
  var $ = function (id) { return document.getElementById(id); };

  var app = $('app'), viewport = $('viewport'), world = $('world'), svg = $('edges'),
      track = $('track'), insp = $('insp'), caps = $('caps'), scrim = $('scrim'),
      palInput = $('palInput'), palList = $('palList'), runBtn = $('runBtn'),
      posLabel = $('posLabel'), countEl = $('count'), legendLive = $('legendLive'),
      zoomVal = $('zoomVal'), hint = $('hint'), toasts = $('toasts'),
      annolayer = $('annolayer'), leads = $('leads'), noteCnt = $('noteCnt'),
      addNoteBtn = $('addNote'), layerSw = $('layerSw'), dropline = $('dropline'), editBtn = $('editBtn'),
      resizer = $('resizer'), bodyEl = document.querySelector('.body'),
      followBtn = $('followBtn'), pauseBtn = $('pauseBtn');

  // top bar removed — its controls now live on the canvas; keep detached stubs so old refs stay safe
  var _stub = document.createElement('div');
  noteCnt = noteCnt || _stub; addNoteBtn = addNoteBtn || _stub; layerSw = layerSw || _stub;
  editBtn = editBtn || _stub; followBtn = followBtn || _stub;
  hint = hint || _stub; countEl = countEl || _stub;

  var ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3l8 5-8 5z" fill="currentColor"/></svg>';
  var ICON_STOP = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.6" fill="currentColor"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="9" y="3" width="3" height="10" rx="1" fill="currentColor"/></svg>';

  var NODES = [], INDEX = {}, ROOT = { id: '_root', children: [], collapsed: false, depth: -1, h: 0, y: 0 };
  var state = {}, selected = null, current = null, live = false, notes = [], timer = null, step = 0, hereTopic = 1;
  var pageNotes = [];
  var seq = 0, editing = false, follow = true;
  var DUR = [], cumEnd = [], totalDur = 1, liveIdx = -1, viewIdx = -1, reviewing = false, tlDrag = false;

  var W = [225, 310, 255];
  var X = [0, 360, 810];
  var X_TREE = 810, X_NOTES = 1090;   // follow-up column shifts right on the notes layer
  var GAP = [34, 16, 10];
  var BLOCK_GAP = 128;   // extra air between one topic+its questions and the next block

  function topics() { return ROOT.children; }

  /* ---------- model ---------- */
  function mk(o) {
    o.children = o.children || [];
    if (o.collapsed === undefined) o.collapsed = false;
    o.id = o.id || ('n' + (++seq));
    NODES.push(o); INDEX[o.id] = o;
    return o;
  }
  function attach(parent, node, index) {
    node.parent = parent;
    if (index === undefined || index < 0) parent.children.push(node);
    else parent.children.splice(index, 0, node);
    return node;
  }
  function detach(node) {
    var a = node.parent.children, i = a.indexOf(node);
    if (i > -1) a.splice(i, 1);
  }
  function walk(n, fn) { fn(n); n.children.forEach(function (c) { walk(c, fn); }); }

  /* ---------- history ---------- */
  var undoStack = [], redoStack = [];
  function ser(n) { return { i: n.id, k: n.kind, t: n.text, m: n.mins, c: n.collapsed, cu: n.cues, ak: n.asks, ch: n.children.map(ser) }; }
  function snap() { return JSON.stringify(ROOT.children.map(ser)); }
  function pushHistory(before) {
    undoStack.push(before === undefined ? snap() : before);
    if (undoStack.length > 60) undoStack.shift();
    redoStack.length = 0;
    scheduleFileSave();
  }
  function rebuild(d, parent) {
    var n = attach(parent, mk({ id: d.i, kind: d.k, depth: parent.depth + 1, text: d.t, mins: d.m, collapsed: d.c }));
    if (d.cu) n.cues = d.cu;
    if (d.ak) n.asks = d.ak;
    d.ch.forEach(function (c) { rebuild(c, n); });
    return n;
  }
  function nodeCues(n) { if (!n.cues) n.cues = cues(n); return n.cues; }   // materialize the heuristic once, then it's editable
  function nodeAsks(n) { if (!n.asks) n.asks = [n.text.split(/[,:?]/)[0].toLowerCase().trim()].filter(Boolean); return n.asks; }
  function restore(json) {
    var data = JSON.parse(json);
    NODES.forEach(function (n) {
      if (n.el) n.el.remove();
      if (n.ghostEl) n.ghostEl.remove();
      if (n.fold) n.fold.remove();
    });
    NODES = []; INDEX = {}; ROOT.children = [];
    data.forEach(function (d) { rebuild(d, ROOT); });
    renumber(); layout(); buildSpine();
    if (selected && INDEX[selected]) select(selected, false);
    else { selected = null; drawInspector(); }
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snap());
    restore(undoStack.pop());
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snap());
    restore(redoStack.pop());
  }

  Object.keys(TREE).forEach(function (k) {
    var t = TREE[k], head = t.head.split('~');
    var tn = attach(ROOT, mk({ id: 'topic' + k, kind: 'topic', depth: 0,
      text: head[0].replace(/^\d+\s*·\s*/, '').trim(), mins: (head[1] || '4 min').trim() }));
    attach(tn, mk({ id: 'm' + k, kind: 'opener', depth: 1, text: t.main.replace(/^"|"$/g, '') }));
    t.qs.forEach(function (q) {
      var m = q.t.match(/^(Q[\d.]+)\s+(.*)$/);
      var qn = attach(tn, mk({ id: q.id, kind: q.probe ? 'probe' : 'standard', depth: 1,
        text: m ? m[2] : q.t, collapsed: true }));
      q.f.forEach(function (f) {
        attach(qn, mk({ id: f.id, kind: f.probe ? 'fprobe' : 'follow', depth: 2,
          text: f.t.replace(/^↳\s*/, '') }));
      });
    });
  });
  var closeT = attach(ROOT, mk({ id: 'topic8', kind: 'topic', depth: 0, text: 'CLOSE & NOTES', mins: '2 min' }));
  attach(closeT, mk({ id: 'close', kind: 'opener', depth: 1, text: 'What should I have asked you that I didn\u2019t?' }));

  function renumber() {
    topics().forEach(function (t, i) {
      t.n = i + 1; t.topic = t.n; t.label = 'TOPIC ' + t.n;
      t.minutes = parseFloat(t.mins) || 4;
      var qi = 0;
      t.children.forEach(function (c) {
        c.topic = t.n; c.depth = 1;
        if (c.kind === 'opener') c.label = 'OPENER';
        else { qi++; c.label = 'Q' + t.n + '.' + qi; }
        c.children.forEach(function (f) { f.topic = t.n; f.depth = 2; f.label = '↳'; });
      });
      t.qs = t.children.filter(function (c) { return c.kind !== 'opener'; });
    });
    NODES.forEach(refreshLabel);
    countEl.textContent = topics().reduce(function (a, t) { return a + t.qs.length; }, 0) + ' Q · ' +
      topics().reduce(function (a, t) { return a + t.minutes; }, 0) + ' MIN';
  }

  /* ---------- cues ---------- */
  var STOP = ('what how why when who where do does did you your the a an and or of to in on for it its is are was were be been ' +
    'that this those these with from at by as if any some more most much many other others than then there here into out up down ' +
    'about over under again actually really ever still just only also them they their he she we us my mine one two get got go goes ' +
    'going make makes made take takes let lets keep keeps come comes tell walk say says something anything work works worked working ' +
    'use uses used using thing things way ways would could should can may might will have has had not no yes but so all each between ' +
    'around after before does').split(/\s+/);
  function cues(n) {
    var seen = {}, out = [];
    n.text.toLowerCase().replace(/[^a-z\s-]/g, ' ').split(/\s+/).forEach(function (w) {
      if (w.length < 4 || STOP.indexOf(w) > -1 || seen[w]) return;
      seen[w] = 1; out.push(w);
    });
    return out.sort(function (a, b) { return b.length - a.length; }).slice(0, 4);
  }

  /* ---------- rendering ---------- */
  var chev = '<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1 L6 4 L2 7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function ensureEl(n) {
    if (n.el) return;
    var el = document.createElement('div');
    el.className = 'node ' + (n.kind === 'fprobe' ? 'follow probe' : n.kind === 'probe' ? 'probe' : n.kind);
    el.dataset.id = n.id;
    el.tabIndex = 0;
    el.style.width = W[n.depth] + 'px';
    el.style.left = X[n.depth] + 'px';
    el.innerHTML = '<span class="edge3"></span><span class="id"></span>' +
      '<span class="q">' + esc(n.text) + '</span>' +
      (n.kind === 'topic' ? '<span class="mins"></span>' : '') +
      '<span class="ctl"><button data-act="add" title="Add after">+</button>' +
      '<button class="del" data-act="del" title="Delete">−</button></span>';
    n.el = el; world.appendChild(el);

    if (n.depth < 2) {
      var g = document.createElement('div');
      g.className = 'ghost'; g.dataset.ghost = n.id;
      g.style.width = W[n.depth + 1] + 'px';

  /* ---------- layout ---------- */

  /* ================= page notes: connectable canvas notes ================= */
  var conns = $('conns'), noteBusy = false;

  }
  function drawConns() {
    if (!conns) return;
    var parts = [];
    pageNotes.forEach(function (note) {
      var collapsed = note.el.classList.contains('collapsed');
      var w = collapsed ? 16 : (note.el.offsetWidth || 184), h = collapsed ? 16 : (note.el.offsetHeight || 46);
      var nx = note.x + w / 2, ny = note.y + h / 2;

      function up() { noteBusy = false; el.classList.remove('grabbing'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); if (moved) scheduleFileSave(); else el.querySelector('.pn-tx').focus(); }
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
    });
  }

  function addPageNote(x, y, seed) {

      x: x, y: y, text: (seed && seed.text) || '', mm: !!(seed && seed.mm), links: (seed && seed.links) ? seed.links.slice() : [] };

      '<button class="pn-del" title="Delete note">×</button>' +

  function rebuildPageNotes(arr) { clearPageNotes(); (arr || []).forEach(function (s) { addPageNote(s.x, s.y, s); }); drawConns(); }

  /* ---------- pan & zoom ---------- */
  var pan = null;
  viewport.addEventListener('pointerdown', function (e) {
    var ui = '.zoomctl,.caps,.anode,.sticky,.dock,.transport,.rater,.qnote,.livenote,.worldnote,.filemenu,.pnote,.conn-hit';
    var block = layerName === 'notes' ? ui : '.node,.fold,.ghost,' + ui;

  /* ---------- spine ---------- */

  /* ---------- editing ---------- */
  function newNode(kind, depth, text) {

  function edit(id) {
    var n = INDEX[id]; if (!n) return;

    var q = n.el.querySelector('.q');

    function key(e) {
      if (e.key === 'Enter') { e.preventDefault(); q.blur(); }
      if (e.key === 'Escape') { q.textContent = n.text; q.blur(); }
      e.stopPropagation();
    }
    q.addEventListener('blur', commit);
    q.addEventListener('keydown', key);
  }

  world.addEventListener('dblclick', function (e) {
    if (!editing) return;
    var el = e.target.closest('.node');
    if (el && !e.target.closest('.ctl')) { e.stopPropagation(); edit(el.dataset.id); }
  });

  world.addEventListener('click', function (e) {
    var g = editing && e.target.closest('[data-ghost]');
    if (g) {
      var pid = g.dataset.ghost;
      if (pid === '_root') addTopic(); else addChild(INDEX[pid]);
      return;
    }
    var act = editing && e.target.closest('[data-act]');
    if (act) {
      var n = INDEX[act.closest('.node').dataset.id];
      if (act.dataset.act === 'add') addSibling(n); else del(n);
      return;
    }
    var f = e.target.closest('[data-fold]');
    if (f) { var m = INDEX[f.dataset.fold]; m.collapsed = !m.collapsed; ensureFold(m); layout(); return; }
    var nd = e.target.closest('[data-id]');
    if (nd && !dragMoved) select(nd.dataset.id, false);
  });

  var allOpen = false;
  var _expandAll = $('expandAll');
  if (_expandAll) _expandAll.addEventListener('click', function () {
    allOpen = !allOpen;
    NODES.forEach(function (n) { if (n.depth === 1 && n.children.length) n.collapsed = !allOpen; });
    layout();
    this.textContent = allOpen ? 'COLLAPSE ALL' : 'EXPAND ALL';
  });

  /* ---------- drag to reorder ---------- */
  var drag = null, dragMoved = false;
  world.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.node');
    if (!editing) return;
    if (!el || e.target.closest('.ctl') || e.target.closest('[contenteditable="true"]')) return;
    if (app.classList.contains('layer-notes')) return;
    var n = INDEX[el.dataset.id];
    var p = toWorld(e.clientX, e.clientY);
    drag = { n: n, ox: p.x - n.x, oy: p.y - n.y, started: false, pid: e.pointerId };
    dragMoved = false;
    el.setPointerCapture(e.pointerId);
  });

  world.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = toWorld(e.clientX, e.clientY);
    var n = drag.n;
    if (!drag.started) {
      if (Math.abs(p.y - drag.oy - n.y) < 4 && Math.abs(p.x - drag.ox - n.x) < 4) return;
      drag.started = true; dragMoved = true;
      n.el.classList.add('dragging');
    }
    n.el.style.left = (p.x - drag.ox) + 'px';
    n.el.style.top = (p.y - drag.oy) + 'px';
    var t = dropTarget(n, p.y);
    drag.target = t;
    if (t) {
      dropline.style.display = 'block';
      dropline.style.left = X[n.depth] + 'px';
      dropline.style.width = W[n.depth] + 'px';
      dropline.style.top = t.y + 'px';
    } else dropline.style.display = 'none';
  });

  function dropTarget(n, cursorY) {
    var cands = n.depth === 0 ? [ROOT]
      : NODES.filter(function (m) { return m.depth === n.depth - 1 && !isHidden(m) && !m.collapsed && m !== n; });
    if (!cands.length) return null;
    var best = null, bd = 1e12;
    cands.forEach(function (c) {
      var kids = c.children.filter(function (k) { return k !== n; });
      var top = kids.length ? kids[0].y : (c.y || 0);
      var bot = kids.length ? kids[kids.length - 1].y + kids[kids.length - 1].h : (c.y || 0) + (c.h || 0);
      var d = cursorY < top ? top - cursorY : cursorY > bot ? cursorY - bot : 0;
      if (d < bd) { bd = d; best = c; }
    });
    if (!best) return null;
    var kids = best.children.filter(function (k) { return k !== n; });
    var idx = kids.length;
    for (var i = 0; i < kids.length; i++) {
      if (cursorY < kids[i].y + kids[i].h / 2) { idx = i; break; }
    }
    var y = kids.length === 0 ? (best.y || 0) + (best.h || 0) / 2
      : idx === 0 ? kids[0].y - 6
      : kids[idx - 1].y + kids[idx - 1].h + 4;
    return { parent: best, index: idx, y: y };
  }

  function endDrag() {
    if (!drag) return;
    var n = drag.n, t = drag.target;
    n.el.classList.remove('dragging');
    dropline.style.display = 'none';
    if (drag.started && t) {
      pushHistory();
      // t.index is already computed with n excluded from the sibling list, so no extra shift
      detach(n);
      attach(t.parent, n, t.index);
      if (n.depth !== t.parent.depth + 1) {
        walk(n, function (m) { m.depth = Math.min(2, m.parent.depth + 1); if (m.el) { m.el.style.width = W[m.depth] + 'px'; } });
      }
      renumber(); buildSpine();
    }
    layout();
    drag = null;
    setTimeout(function () { dragMoved = false; }, 0);
  }
  world.addEventListener('pointerup', endDrag);
  world.addEventListener('pointercancel', endDrag);

  /* ---------- selection & inspector ---------- */
  function select(id, moveCam) {
    var n = INDEX[id]; if (!n) return;
    selected = id;
    NODES.forEach(function (m) { m.el.classList.toggle('sel', m.id === id); });
    var p = n.parent, changed = false;
    while (p && p.id !== '_root') { if (p.collapsed) { p.collapsed = false; ensureFold(p); changed = true; } p = p.parent; }
    if (changed) layout();
    if (moveCam) centerOn(n, Math.max(cam.z, .7), true);
    markHere(n.topic || hereTopic);
    posLabel.textContent = (n.label === '↳' ? 'FOLLOW-UP' : n.label) + (n.depth ? ' · TOPIC ' + n.topic : '');
    drawInspector();
  }

  function drawInspector() {
    var n = INDEX[selected], html = '';
    if (live && notes.length) {
      html += '<div class="kicker">COVERED OUT OF ORDER · ' + notes.length + '</div><div class="notes">';
      notes.slice().reverse().forEach(function (x) {
        html += '<button class="note" data-jump="' + x.id + '"><b>' + x.label + ' · TOPIC ' + x.topic + '</b>' + esc(x.text) + '</button>';
      });
      html += '</div><div class="hr" style="margin-top:6px"></div>';
    }
    if (!n) { html += '<div class="empty">Select a node, or double-click one to rename it.</div>'; insp.innerHTML = html; wireInsp(); return; }
    if (n.kind === 'topic') {
      html += '<div class="kicker">' + n.label + '</div>' +
        '<div class="fld"><label>Title</label><div class="qbox" contenteditable="EDITABLE" data-edit="' + n.id + '">' + esc(n.text) + '</div></div>' +
        '<div class="fld"><label>Time budget</label><div class="qbox" contenteditable="EDITABLE" data-mins="' + n.id + '">' + esc(n.mins) + '</div></div>' +
        '<div class="empty">' + n.qs.length + ' questions. Drag the topic card to reorder it; the spine and all IDs renumber.</div>';
      insp.innerHTML = html.replace(/contenteditable="EDITABLE"/g, 'contenteditable="' + editing + '"'); wireInsp(); return;
    }
    var isF = n.depth === 2;
    html += '<div class="kicker">' + (n.kind === 'opener' ? 'TOPIC ' + n.topic + ' OPENER' : isF ? 'FOLLOW-UP TO ' + n.parent.label : n.label) + '</div>';
    html += '<div class="fld"><label>Question</label><div class="qbox" contenteditable="EDITABLE" data-edit="' + n.id + '">' + esc(n.text) + '</div></div>';
    html += '<div class="fld"><label>Counts as asking <button class="ai-btn" data-aiasks="' + n.id + '">✦ auto</button></label>' +
      '<div class="tags">' +
      nodeAsks(n).map(function (c) { return '<span class="tag">' + esc(c) + '<button class="tagx" data-rmask="' + esc(c) + '">×</button></span>'; }).join('') +
      '<span class="tag add" id="addAsk">+</span></div></div>';
    html += '<div class="fld"><label>Counts as answered <button class="ai-btn" data-aicues="' + n.id + '">✦ auto</button></label>' +
      '<div class="tags">' +
      nodeCues(n).map(function (c) { return '<span class="tag">' + esc(c) + '<button class="tagx" data-rmcue="' + esc(c) + '">×</button></span>'; }).join('') +
      '<span class="tag add" id="addCue">+</span></div></div>';
    var sv = n.kind === 'opener' ? 48 : /probe/.test(n.kind) ? 70 : 62;
    html += '<div class="fld"><label>Sensitivity</label><div class="sens">' +
      '<input type="range" min="30" max="90" value="' + sv + '" id="sens"><span class="v" id="sensv">0.' + sv + '</span></div></div>';
    if (live) {
      var s = state[selected] || 'red';
      html += '<div class="hr"></div><div class="fld"><label>Status</label><div class="qbox" style="color:var(--' + s + ')">' +
        (s === 'green' ? 'Answered' : s === 'amber' ? 'Touched on' : 'Not covered') + '</div></div>';
    }
    insp.innerHTML = html.replace(/contenteditable="EDITABLE"/g, 'contenteditable="' + editing + '"'); wireInsp();
  }

  function wireInsp() {
    var sens = $('sens');
    if (sens) sens.addEventListener('input', function () { $('sensv').textContent = '0.' + sens.value; });
    insp.querySelectorAll('[data-jump]').forEach(function (b) {
      b.addEventListener('click', function () { select(b.dataset.jump, true); });
    });
    insp.querySelectorAll('[data-edit]').forEach(function (d) {
      var before = null, was = null;
      d.addEventListener('focus', function () { before = snap(); was = d.textContent; });
      d.addEventListener('blur', function () {
        var n = INDEX[d.dataset.edit]; if (!n) return;
        if (before !== null && d.textContent !== was) pushHistory(before);
        n.text = d.textContent.trim() || n.text;
        n.el.querySelector('.q').textContent = n.text;
        measure(n); layout(); if (n.depth === 0) buildSpine();
      });
      d.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); d.blur(); } e.stopPropagation(); });
    });
    insp.querySelectorAll('[data-mins]').forEach(function (d) {
      var before = null, was = null;
      d.addEventListener('focus', function () { before = snap(); was = d.textContent; });
      d.addEventListener('blur', function () {
        var n = INDEX[d.dataset.mins]; if (!n) return;
        if (before !== null && d.textContent !== was) pushHistory(before);
        n.mins = d.textContent.trim() || n.mins;
        renumber(); layout(); buildSpine();
      });
      d.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); d.blur(); } e.stopPropagation(); });
    });
    // ---- editable cue fields (remove / manual add / AI auto) ----
    wireCueField(nodeAsks, 'asking', 'data-rmask', 'addAsk', 'data-aiasks');
    wireCueField(nodeCues, 'answered', 'data-rmcue', 'addCue', 'data-aicues');
  }

  function wireCueField(getArr, aiKind, rmAttr, addId, aiAttr) {
    insp.querySelectorAll('[' + rmAttr + ']').forEach(function (b) {
      b.addEventListener('click', function () {
        var n = INDEX[selected]; if (!n) return;
        var a = getArr(n), i = a.indexOf(b.getAttribute(rmAttr));
        if (i > -1) a.splice(i, 1);
        scheduleFileSave(); drawInspector();
      });
    });
    var add = $(addId);
    if (add) add.addEventListener('click', function () {
      var inp = document.createElement('input');
      inp.className = 'tag-input'; inp.placeholder = 'add…';
      add.replaceWith(inp); inp.focus();
      var done = false;
      function commit(save) {
        if (done) return; done = true;
        var n = INDEX[selected], v = inp.value.trim().toLowerCase();
        if (save && v && n) { var a = getArr(n); if (a.indexOf(v) < 0) a.push(v); scheduleFileSave(); }
        drawInspector();
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { commit(false); }
        e.stopPropagation();
      });
      inp.addEventListener('blur', function () { commit(true); });
    });
    var ai = insp.querySelector('[' + aiAttr + ']');
    if (ai) ai.addEventListener('click', function () {
      var n = INDEX[selected]; if (!n) return;
      ai.classList.add('busy'); ai.textContent = '…thinking';
      fetch(API + '/api/cues', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: n.text, kind: aiKind }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var a = getArr(n);
          (d.cues || []).forEach(function (x) { if (a.indexOf(x) < 0) a.push(x); });
          scheduleFileSave(); drawInspector();
        })
        .catch(function () { ai.textContent = 'no server'; setTimeout(function () { if (ai.isConnected) { ai.classList.remove('busy'); ai.textContent = '✦ auto'; } }, 1500); });
    });
  }

  /* ---------- palette ---------- */
  var palRows = [], palOn = 0;
  function openPal() { scrim.hidden = false; palInput.value = ''; palInput.focus(); fillPal(''); }
  function closePal() { scrim.hidden = true; }
  function fillPal(q) {
    q = q.trim().toLowerCase();
    palRows = NODES.filter(function (n) { return !q || (n.text + ' ' + n.label + ' ' + n.id).toLowerCase().indexOf(q) > -1; }).slice(0, 40);
    palOn = 0;
    if (!palRows.length) { palList.innerHTML = '<li class="none">No question matches that.</li>'; return; }
    palList.innerHTML = palRows.map(function (n, i) {
      return '<li class="' + (i ? '' : 'on') + '" data-i="' + i + '"><span class="pid">' +
        (n.kind === 'topic' ? 'TOPIC' : n.kind === 'opener' ? 'OPEN' : n.label) + '</span><span class="ptx">' +
        esc(n.text.slice(0, 76)) + '</span><span class="ptp">' + (n.topic || '') + '</span></li>';
    }).join('');
  }
  function movePal(d) {
    var items = palList.children; if (!palRows.length) return;
    items[palOn].classList.remove('on');
    palOn = (palOn + d + palRows.length) % palRows.length;
    items[palOn].classList.add('on'); items[palOn].scrollIntoView({ block: 'nearest' });
  }
  palInput.addEventListener('input', function () { fillPal(this.value); });
  palList.addEventListener('click', function (e) {
    var li = e.target.closest('li[data-i]'); if (li) { select(palRows[+li.dataset.i].id, true); closePal(); }
  });
  scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closePal(); });
  $('palBtn').addEventListener('click', openPal);
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
    if (!scrim.hidden) {
      if (e.key === 'Escape') closePal();
      else if (e.key === 'ArrowDown') { e.preventDefault(); movePal(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePal(-1); }
      else if (e.key === 'Enter' && palRows[palOn]) { select(palRows[palOn].id, true); closePal(); }
      return;
    }
    if (document.querySelector('[contenteditable="true"]:focus')) return;
    if (rateTarget) {
      if (live && e.key >= '1' && e.key <= '3') { e.preventDefault(); applyRate(+e.key); return; }
      if (live && e.key.toLowerCase() === 'n') { e.preventDefault(); applyRate('note'); return; }
      if (e.key === 'Escape') { e.preventDefault(); hideRater(); return; }
      hideRater();   // any other feature engaged — dismiss the rater, then let the key act
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault(); if (e.shiftKey) redo(); else undo(); return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === '\\') { e.preventDefault(); setPanel(!panelOpen); return; }
    if (e.key.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setFollow(!follow); return; }
    if (e.key.toLowerCase() === 'e' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setEdit(!editing); return; }
    if (e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); cycleScene(); return; }
    if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); live ? addLiveNote() : addPageNoteCentered(); return; }
    if (live && e.key.toLowerCase() === 'q' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); addQuestion(); return; }
    if (live && e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); startRec(e.repeat); return; }
    if (!editing || !selected) return;
    if (e.key === 'Enter') { e.preventDefault(); addSibling(INDEX[selected]); }
    if (e.key === 'Tab') { e.preventDefault(); addChild(INDEX[selected]); }
    if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); del(INDEX[selected]); }
  });

  /* ---------- annotation layer & stickies ---------- */
  var annoList = [], stickies = [], stickySeq = 0, layerName = 'tree';

  function addAnno(id, text, kind) {
    var n = INDEX[id]; if (!n) return;
    if (annoList.some(function (a) { return a.id === id && a.kind === kind; })) return;
    var a = { id: id, kind: kind, text: text, stamp: clock(), from: INDEX[current] ? INDEX[current].topic : 1 };
    var el = document.createElement('div');
    el.className = 'anode ' + kind;
    var lab = kind === 'flag' ? 'NEEDS A PROBE' : kind === 'ahead' ? 'ANSWERED AHEAD' : 'ANSWER';
    el.innerHTML = '<span class="m">' + lab + '<span class="src">' + a.stamp +
      (kind === 'ahead' ? ' · FROM T' + a.from : '') + '</span></span>' +
      '<div class="tx" contenteditable="true" spellcheck="false">' + esc(text) + '</div>';
    a.el = el; annoList.push(a); annolayer.appendChild(el); a.h = el.offsetHeight;
    if (n.parent && n.parent.collapsed) { n.parent.collapsed = false; ensureFold(n.parent); }
    updateCount(); layout();
  }
  function clearAnnos() { annoList.forEach(function (a) { a.el.remove(); }); annoList = []; updateCount(); layoutAnnos(); }
  function updateCount() { noteCnt.textContent = annoList.length + stickies.length; }

  function layoutAnnos() {
    var lanes = {}, paths = [];
    annoList.forEach(function (a) {
      var n = INDEX[a.id];
      if (!n || isHidden(n)) { a.el.style.display = 'none'; return; }
      a.el.style.display = '';
      a.h = a.el.offsetHeight || a.h;
      var lane = n.depth, x = X[n.depth] + W[n.depth] + 30, y = n.y + 6;
      lanes[lane] = lanes[lane] || [];
      lanes[lane].forEach(function (p) { if (y < p.b + 7 && y + a.h > p.t - 7) y = p.b + 7; });
      lanes[lane].push({ t: y, b: y + a.h });
      a.el.style.left = x + 'px'; a.el.style.top = y + 'px';
      paths.push('<path class="lead" d="M' + (X[n.depth] + W[n.depth]) + ' ' + (n.y + n.h / 2) + ' L' + x + ' ' + (y + 12) + '"/>');
    });
    leads.innerHTML = paths.join('');
  }

  function addSticky(x, y, text) {
    var st = { id: 'st' + (++stickySeq), x: x, y: y };
    var el = document.createElement('div');
    el.className = 'sticky';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = '<div class="top"><span>NOTE ' + stickySeq + '</span><span class="sp"></span>' +
      '<button class="del">×</button></div>' +
      '<div class="tx" contenteditable="true" spellcheck="false" data-ph="Type a comment…">' + esc(text || '') + '</div>';
    st.el = el; stickies.push(st); annolayer.appendChild(el);
    el.querySelector('.del').addEventListener('click', function (ev) {
      ev.stopPropagation(); el.remove();
      stickies = stickies.filter(function (s) { return s !== st; }); updateCount();
    });
    el.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest('.tx,.del')) return;
      ev.stopPropagation();
      var s0 = toWorld(ev.clientX, ev.clientY), x0 = st.x, y0 = st.y;
      el.classList.add('grabbing'); el.setPointerCapture(ev.pointerId);
      function mv(e2) {
        var p = toWorld(e2.clientX, e2.clientY);
        st.x = x0 + (p.x - s0.x); st.y = y0 + (p.y - s0.y);
        el.style.left = st.x + 'px'; el.style.top = st.y + 'px';
      }
      function up() { el.classList.remove('grabbing'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); }
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
    });
    updateCount();
    setTimeout(function () { el.querySelector('.tx').focus(); }, 30);
    return st;
  }
  addNoteBtn.addEventListener('click', function () {
    var r = viewport.getBoundingClientRect();
    var p = toWorld(r.left + viewport.clientWidth / 2, r.top + vh() / 2);
    addSticky(p.x - 93, p.y - 30);
  });
  viewport.addEventListener('dblclick', function (e) {
    if (editing || layerName === 'mindmap') return;
    if (e.target.closest('.node,.fold,.ghost,.pnote,.sticky,.anode,.zoomctl,.caps,.dock,.transport,.filemenu,.conn-hit,.rater,.qnote')) return;
    var p = toWorld(e.clientX, e.clientY);
    addPageNote(p.x, p.y);            // notes are addable anytime, right on the canvas
  });
  var SCENES = ['tree', 'notes', 'mindmap'];
  function setLayer(name) {
    layerName = name;
    app.classList.toggle('layer-notes', name === 'notes');
    app.classList.toggle('layer-mindmap', name === 'mindmap');
    addNoteBtn.hidden = name !== 'notes';
    layerSw.querySelectorAll('[data-layer]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.layer === name));
    });
    var d = $('dock');
    if (d) d.querySelectorAll('[data-scene]').forEach(function (b) { b.classList.toggle('on', b.dataset.scene === name); });
    hint.textContent = name === 'notes' ? 'DOUBLE-CLICK TO DROP A STICKY'
      : name === 'mindmap' ? 'MIND MAP — COMING SOON · S CYCLES SCENES'
      : 'DRAG TO PAN · ⌥SCROLL TO ZOOM · E TO EDIT';
    X[2] = name === 'notes' ? X_NOTES : X_TREE;
    NODES.forEach(function (n) { if (n.depth === 2 && n.el) n.el.style.left = X[2] + 'px'; });
    pageNotes.forEach(function (nt) { nt.expanded = false; updateCollapse(nt); });   // dots on tree, full on mind map
    layout();
  }
  function cycleScene() { setLayer(SCENES[(SCENES.indexOf(layerName) + 1) % SCENES.length]); }
  function setDockLive(on) {
    var d = $('dock'); if (!d) return;
    d.querySelectorAll('.live-act').forEach(function (b) { b.disabled = !on; });
  }
  $('dock').addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    if (a) {
      if (a.dataset.act === 'edit') setEdit(!editing);
      else if (a.dataset.act === 'follow') setFollow(!follow);
      else if (a.dataset.act === 'note') { live ? addLiveNote() : addPageNoteCentered(); }
      else if (a.dataset.act === 'question') addQuestion();
      else if (a.dataset.act === 'record') { startRec(false); stopRec(); }
      return;
    }
    var s = e.target.closest('[data-scene]');
